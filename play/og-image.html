<!doctype html>
<!--
  Source for web/assets/og.jpg, the 1200x630 link-preview image (og:image / twitter:image).

  The radio picture is a real screenshot of the app (og-app.png): the web app's launcher on broadcast FM with an
  RTL-SDR Blog V4, cropped from the top of the waterfall to the frequency axis. Nothing in it is drawn.

  Render with Edge or Chrome headless, then save as a quality-90 JPEG to web/assets/og.jpg:
    msedge --headless=new --hide-scrollbars --window-size=1200,630 --virtual-time-budget=6000
           --user-data-dir=<temp dir> --screenshot=og.png file:///.../play/og-image.html
  --user-data-dir matters when Edge is already open: without it the headless run joins that instance and writes
  nothing.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=block">
<style>
  :root { --paper: #0a0d13; --ink: #e8ecf4; --muted: #8d97ab; --accent: #4c8dff; --amber: #ffaf00; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  body { position: relative; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; color: var(--ink); }
  .stripe { position: absolute; left: 0; top: 0; width: 100%; height: 10px; background: var(--accent); z-index: 3; }
  /* the real app panel, full height on the right, axis on the bottom edge as in the app */
  .app { position: absolute; right: 0; top: 10px; height: 620px; width: auto; display: block; }
  /* fade it into the paper under the type so the words sit on clean ground */
  .fade { position: absolute; left: 0; top: 0; width: 760px; height: 100%;
          background: linear-gradient(90deg, var(--paper) 0%, var(--paper) 52%, rgba(10,13,19,0.82) 70%, rgba(10,13,19,0) 100%); }
  .copy { position: absolute; left: 64px; top: 70px; width: 600px; z-index: 2; }
  .eyebrow { font-weight: 700; font-size: 20px; letter-spacing: 0.22em; color: var(--amber); }
  .mark { margin-top: 22px; font-weight: 800; font-size: 118px; line-height: 0.92; letter-spacing: -0.02em; }
  .mark span { display: block; color: var(--accent); text-shadow: 0 0 34px rgba(76, 141, 255, 0.45); }
  .hook { margin-top: 34px; font-weight: 700; font-size: 34px; line-height: 1.25; }
  .sub { margin-top: 12px; font-weight: 500; font-size: 25px; color: var(--muted); }
  .url { position: absolute; left: 64px; bottom: 44px; z-index: 2; font-weight: 700; font-size: 22px; letter-spacing: 0.04em; color: var(--muted); }
  .url b { color: var(--ink); font-weight: 700; }
</style>
</head>
<body>
<img class="app" src="og-app.png" alt="">
<div class="fade"></div>
<div class="stripe"></div>
<div class="copy">
  <div class="eyebrow">HACKRF · PORTAPACK · RTL-SDR</div>
  <div class="mark">MAYHEM<span>MOBILE</span></div>
  <div class="hook">Plug the radio into<br>your phone.</div>
  <div class="sub">No PC. No drivers. Browser or Android.</div>
</div>
<div class="url"><b>rocketgod.dev</b>/mayhem-mobile</div>
</body>
</html>
