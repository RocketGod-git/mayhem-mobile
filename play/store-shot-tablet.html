<!doctype html>
<!--
  Source for the Play Store 10-inch tablet screenshots in en-US/tablet/: a real landscape capture of the Android app
  on a Pixel C emulator with the demo signal (captures/tablet/*.png, from the android-ux-shots workflow), its status
  bar and the emulator's taskbar trimmed off, under one headline. Same look as store-shot.html; nothing on the
  screen is drawn or edited.

  One frame per render, chosen by the query string: ?img=captures/tablet/adsb.png&h=Every%20plane%20overhead&s=...
  Render at 2560x1600 with Edge or Chrome headless (see render-store-tablet.ps1).
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=block">
<style>
  :root { --paper: #0a0d13; --ink: #e8ecf4; --muted: #8d97ab; --accent: #4c8dff; --amber: #ffaf00; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2560px; height: 1600px; overflow: hidden; background: var(--paper); }
  body { position: relative; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; color: var(--ink); }
  .stripe { position: absolute; left: 0; top: 0; width: 100%; height: 14px; background: var(--accent); }
  /* a faint blue bloom behind the tablet, the color of the app's own accent */
  .bloom { position: absolute; left: 50%; top: 380px; width: 2600px; height: 1700px; transform: translateX(-50%);
           background: radial-gradient(closest-side, rgba(76,141,255,0.22), rgba(76,141,255,0) 70%); }
  .copy { position: absolute; left: 380px; right: 380px; top: 80px; text-align: center; }
  .eyebrow { font-weight: 700; font-size: 28px; letter-spacing: 0.2em; color: var(--amber); }
  h1 { margin-top: 18px; font-weight: 800; font-size: 80px; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }
  .sub { margin-top: 18px; font-weight: 500; font-size: 34px; line-height: 1.3; color: var(--muted); text-wrap: balance; }
  /* the real screen: 2560 wide capture shown at 1800, status bar and taskbar cut off */
  .screen { position: absolute; left: 50%; top: 410px; width: 1800px; height: calc(1800px * var(--keep) / 2560);
            transform: translateX(-50%); border-radius: 36px; overflow: hidden; border: 3px solid #26324a;
            box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 0 10px #121826; background: #0a0d13; }
  .screen img { display: block; width: 100%; margin-top: calc(-1800px * var(--top) / 2560); }
</style>
</head>
<body>
<div class="bloom"></div>
<div class="stripe"></div>
<div class="copy">
  <div class="eyebrow" id="e"></div>
  <h1 id="h"></h1>
  <div class="sub" id="s"></div>
</div>
<div class="screen" id="screen"><img id="img" alt=""></div>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('e').textContent = p.get('e') || 'HACKRF · RTL-SDR · PORTAPACK';
  document.getElementById('h').textContent = p.get('h') || '';
  document.getElementById('s').textContent = p.get('s') || '';
  document.getElementById('img').src = p.get('img');
  // capture pixels: the status bar ends at `top`, the emulator taskbar starts at `bottom` (2560x1800 Pixel C)
  const cutTop = +(p.get('top') || 48), cutBottom = +(p.get('bottom') || 1680);
  const screen = document.getElementById('screen');
  screen.style.setProperty('--top', cutTop);
  screen.style.setProperty('--keep', cutBottom - cutTop);
</script>
</body>
</html>
