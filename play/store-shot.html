<!doctype html>
<!--
  Source for the Play Store phone screenshots in en-US/phone/: a real capture of the Android app (captures/*.png,
  taken with `adb exec-out screencap -p` on a phone with the radio attached), its status bar trimmed off, under
  one headline. Nothing on the phone screen is drawn or edited.

  One frame per render, chosen by the query string: ?img=captures/adsb.png&h=Every%20plane%20overhead&s=...
  Render at 1080x1920 with Edge or Chrome headless (see render-store.ps1).
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=block">
<style>
  :root { --paper: #0a0d13; --ink: #e8ecf4; --muted: #8d97ab; --accent: #4c8dff; --amber: #ffaf00; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
  body { position: relative; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; color: var(--ink); }
  .stripe { position: absolute; left: 0; top: 0; width: 100%; height: 14px; background: var(--accent); }
  /* a faint blue bloom behind the phone, the color of the app's own accent */
  .bloom { position: absolute; left: 50%; top: 860px; width: 1300px; height: 1300px; transform: translateX(-50%);
           background: radial-gradient(closest-side, rgba(76,141,255,0.22), rgba(76,141,255,0) 70%); }
  .copy { position: absolute; left: 72px; right: 72px; top: 96px; }
  .eyebrow { font-weight: 700; font-size: 28px; letter-spacing: 0.2em; color: var(--amber); }
  h1 { margin-top: 22px; font-weight: 800; font-size: 74px; line-height: 1.05; letter-spacing: -0.02em; text-wrap: balance; }
  .sub { margin-top: 22px; font-weight: 500; font-size: 34px; line-height: 1.3; color: var(--muted); text-wrap: balance; }
  /* the real screen, status bar trimmed, bleeding off the bottom edge */
  .screen { position: absolute; left: 50%; top: 560px; width: 900px; height: 1500px; transform: translateX(-50%);
            border-radius: 44px; overflow: hidden; border: 3px solid #26324a;
            box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 0 10px #121826; background: #0a0d13; }
  .screen img { display: block; width: 100%; margin-top: calc(-1 * var(--trim)); }
</style>
</head>
<body>
<div class="bloom"></div>
<div class="stripe"></div>
<div class="copy">
  <div class="eyebrow" id="e"></div>
  <h1 id="h"></h1>
  <div class="sub" id="s"></div>
</div>
<div class="screen"><img id="img" alt=""></div>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('e').textContent = p.get('e') || 'HACKRF · RTL-SDR · PORTAPACK';
  document.getElementById('h').textContent = p.get('h') || '';
  document.getElementById('s').textContent = p.get('s') || '';
  const img = document.getElementById('img');
  img.src = p.get('img');
  // the phone's status bar (clock, notifications) is not the app: trim it, as a fraction of the capture's height
  img.style.setProperty('--trim', `calc(${p.get('trim') || 0.052} * 900px * ${p.get('ar') || 2.179})`);
</script>
</body>
</html>
