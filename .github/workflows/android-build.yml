name: Android Build

# Compile check for branches and PRs: assembles the DEBUG APK and the release bundle (no secrets needed; the release
# build falls back to the debug key), and uploads the APK as a workflow
# artifact. main is built and published by release.yml (APK + web site from the same commit).
on:
  push:
    branches-ignore: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble debug
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee android_build.log

      # The release build is the one that runs R8 and packs native symbols; catch its failures before main does.
      - name: Release bundle
        run: |
          set -o pipefail
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee -a android_build.log

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon 2>&1 | tee -a android_build.log

      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v7
        with:
          name: mayhem-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android_build.log
          path: android_build.log
