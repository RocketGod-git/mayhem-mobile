name: Layout Shots

# Every screen of a debug build on an emulated phone and tablet, portrait and landscape, fed by the synthetic demo
# signal, plus the picture-in-picture window. For reviewing layouts without hardware; not for the store listing.

on:
  workflow_dispatch:
  push:
    branches: [ mobile-ux ]

permissions:
  contents: read

jobs:
  shots:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_6, pixel_c]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot the emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/ux-shots.sh shots

      - uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.profile }}
          path: shots/*.png
